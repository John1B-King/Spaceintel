<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#090909">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Axinter — Sign In</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
</head>
<body>

<!-- Loading -->
<div id="ax-loading" class="ax-loading">
  <div class="ax-loading-logo">Ax</div>
  <p>Starting up…</p>
</div>

<!-- Login Page -->
<div class="ax-login-page" id="ax-login-page" style="display:none">
  <div class="ax-login-bg"></div>
  <div class="ax-login-grid"></div>

  <div class="ax-login-card">
    <!-- Logo -->
    <div class="ax-login-logo-wrap">
      <div class="ax-login-logo-mark">Ax</div>
      <div class="ax-login-brand">Axinter</div>
    </div>
    <div class="ax-login-tagline">Intelligence, Redefined.</div>

    <div class="ax-login-divider"></div>

    <div class="ax-login-title">Welcome back</div>
    <div class="ax-login-sub" id="ax-login-sub">Sign in to continue</div>

    <!-- Native app login button (shown inside Median) -->
    <button class="ax-app-login-btn hidden" id="ax-native-google-btn" onclick="doNativeGoogleLogin()">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>

    <!-- Web Google button (shown in browser) -->
    <div id="ax-google-btn"></div>

    <!-- Divider for app mode -->
    <div id="ax-or-divider" class="hidden" style="display:flex;align-items:center;gap:12px;margin:8px 0">
      <div style="flex:1;height:1px;background:var(--bd2)"></div>
      <span style="font-size:12px;color:var(--text-d)">or</span>
      <div style="flex:1;height:1px;background:var(--bd2)"></div>
    </div>

    <!-- Guest / Demo mode -->
    <button class="ax-app-login-btn hidden" id="ax-guest-btn" onclick="continueAsGuest()" style="border-color:var(--bd2);background:var(--s2)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
      </svg>
      Continue as Guest
    </button>

    <div class="ax-login-footer">
      <a href="#" onclick="return false">Terms</a>
      <a href="#" onclick="return false">Privacy</a>
    </div>
  </div>
</div>

<!-- Google Identity Services -->
<script src="https://accounts.google.com/gsi/client" async></script>

<script>
// Inject Median bridge config
eval(AX_CONFIG.median.onReady);

window.addEventListener('load', init);

function init() {
  // Check existing session
  try {
    const stored = sessionStorage.getItem('ax_user') || localStorage.getItem('ax_session');
    if (stored) {
      const user = JSON.parse(stored);
      if (user && user.id) {
        window.location.replace('chat.html');
        return;
      }
    }
  } catch {}

  // Detect Median app
  const inApp = isInApp();

  setTimeout(() => {
    AX_UI.hideLoading();
    document.getElementById('ax-login-page').style.display = '';
  }, 600);

  if (inApp) {
    // Show native Google button
    document.getElementById('ax-native-google-btn').classList.remove('hidden');
    document.getElementById('ax-google-btn').style.display = 'none';
    document.getElementById('ax-or-divider').classList.remove('hidden');
    document.getElementById('ax-guest-btn').classList.remove('hidden');
    document.getElementById('ax-login-sub').textContent = 'Sign in with your Google account';

    // Update status bar for Median
    function median_library_ready() {
      median.statusbar.set({ style: 'light', color: '#090909' });
    }
    if (window.median) median_library_ready();

  } else {
    // Web: load Google GIS
    loadGoogleGIS();
    document.getElementById('ax-guest-btn').classList.remove('hidden');
    document.getElementById('ax-or-divider').classList.remove('hidden');
  }
}

function loadGoogleGIS() {
  // GIS renders its own button
  function initGIS() {
    if (!window.google?.accounts?.id) { setTimeout(initGIS, 200); return; }
    google.accounts.id.initialize({
      client_id: AX_CONFIG.google.clientId,
      callback: handleCredential,
      auto_select: false,
    });
    google.accounts.id.renderButton(document.getElementById('ax-google-btn'), {
      theme: 'filled_black',
      size: 'large',
      width: 312,
      text: 'continue_with',
    });
    google.accounts.id.prompt();
  }
  initGIS();
}

function handleCredential(response) {
  const payload = parseJWT(response.credential);
  const user = {
    id: payload.sub,
    name: payload.name,
    email: payload.email,
    picture: payload.picture,
    provider: 'google',
  };
  saveAndRedirect(user);
}

async function doNativeGoogleLogin() {
  try {
    haptic('medium');
    document.getElementById('ax-native-google-btn').textContent = 'Signing in…';
    const data = await medianGoogleLogin();
    const u = data.user;
    const user = {
      id: u.id || u.sub || u.email,
      name: u.name || u.displayName,
      email: u.email,
      picture: u.photoUrl || u.picture || '',
      provider: 'google_native',
    };
    saveAndRedirect(user);
  } catch (e) {
    haptic('error');
    AX_UI.toast('Sign-in cancelled', 'error');
    document.getElementById('ax-native-google-btn').innerHTML = `
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="22" height="22">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google`;
  }
}

function continueAsGuest() {
  haptic('light');
  const user = {
    id: 'guest_' + Date.now(),
    name: 'Guest',
    email: 'guest@axinter.app',
    picture: '',
    provider: 'guest',
  };
  saveAndRedirect(user);
}

function saveAndRedirect(user) {
  sessionStorage.setItem('ax_user', JSON.stringify(user));
  localStorage.setItem('ax_session', JSON.stringify(user));
  DB.saveProfile(user.id, {
    name: user.name,
    email: user.email,
    picture: user.picture || '',
    joinDate: Date.now(),
  });
  window.location.replace('chat.html');
}

function parseJWT(token) {
  try {
    const base64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    return JSON.parse(atob(base64));
  } catch { return {}; }
}
</script>
<script src="db.js"></script>
<script src="ui.js"></script>
<script src="markdown.js"></script>
</body>
</html>
